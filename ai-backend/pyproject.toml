[project]
name = "utubot"
version = "0.2.0"
description = "u·tubot backend for the SmartTube AI client"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "yt-dlp>=2025.1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "av>=12,<16"]
diarization = ["pyannote.audio>=4.0.7"]

[project.scripts]
utubot = "utubot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utubot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
