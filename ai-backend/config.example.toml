# u·tubot configuration. Copy to config.toml (or point UTUBOT_CONFIG at it).
# Every value shown is the built-in default unless marked "example".

[server]
host = "127.0.0.1"          # bind address; keep loopback and front it with a reverse proxy
port = 8790
data_dir = "/var/lib/utubot"          # SQLite db, users.toml, media scratch (dev: "./data")
app_dir = "/var/lib/utubot/app"       # APKs + update.json served without auth under /app/ (dev: "./app")
public_base_url = "https://utubot.example.com"   # example; default http://127.0.0.1:8790; the public URL of this server: used in /setup.json and APK download URLs
# users_file = "/var/lib/utubot/users.toml"   # token hashes written by `utubot user add`

[security]
# Peers allowed to set X-Forwarded-For. The real client is the right-most entry that is not
# itself a trusted proxy. Loopback only by default; when a reverse proxy runs on another
# address, add that address (see docs/server.md).
trusted_proxies = ["127.0.0.1", "::1"]
# A second proxy hop (for example a tunnel in front of this service) can replace X-Forwarded-For with its
# own address, so every client looks like that hop and shares one rate-limit and lockout bucket. To name the
# real client instead: the outer proxy sends this header plus a shared secret in X-Utubot-Proxy-Secret, and
# the secret is in the environment variable below. Honoured only from a trusted proxy and only with the
# right secret; empty header name = off (docs/server.md, Reverse proxy and TLS).
client_ip_header = ""             # example: "X-Utubot-Client-IP"
client_ip_header_secret_env = "UTUBOT_PROXY_SECRET"
rate_per_token_per_min = 240
rate_per_ip_per_min = 600
rate_window_s = 60
pair_code_digits = 6
pair_code_ttl_s = 900             # one-time pairing codes live 15 minutes
pair_attempts_per_ip_per_min = 5
pair_lockout_failures = 5         # failed codes from one IP before it is locked out
pair_lockout_s = 900
pair_global_failures = 40         # failed codes from all IPs per window before pairing locks globally
pair_global_window_s = 3600
max_body_bytes = 262144
max_device_name_chars = 64
max_devices_per_user = 20
# Web UI sign-in (username + password, or a pasted token): an HttpOnly session cookie, Secure when
# the browser reached the service over HTTPS (directly or through a trusted proxy that sends
# X-Forwarded-Proto), SameSite=Lax. Cookie-authenticated writes also need the X-CSRF-Token header.
session_cookie = "utubot_session"
session_ttl_s = 2592000           # 30 days, renewed while the session is used
session_refresh_s = 3600          # the cookie is re-issued at most this often
max_sessions_per_user = 20        # oldest sessions are dropped beyond this
password_min_chars = 10
password_max_chars = 256
scrypt_n = 131072                 # scrypt cost (N = 2^17, r, p; about 128 MiB per hash) for new hashes; older hashes still verify and are upgraded at the next sign-in
scrypt_r = 8
scrypt_p = 1
scrypt_max_concurrent = 2         # password hashes computed at the same time (each needs the memory above)
login_attempts_per_ip_per_min = 10
login_lockout_failures = 5        # failed sign-ins from one IP before it is locked out
login_lockout_s = 900
login_user_lockout_failures = 10  # failed sign-ins against one account (from anywhere) before it is locked
login_global_failures = 200       # failed sign-ins from all IPs per window before sign-in locks globally
login_global_window_s = 3600

# The model list the web UI offers (GET /v1/models: each provider's /models, cached).
[models]
cache_ttl_s = 300                 # 5 minutes
error_ttl_s = 30                  # a failing provider is not asked again for this long
refresh_min_interval_s = 10       # the "refresh" button is honoured at most this often
timeout_s = 10.0
new_for_s = 259200                # a model that appeared since the last list is marked "new" for 3 days
max_models_per_provider = 2000

# ---- LLM providers (all OpenAI-compatible chat completions) -----------------------------
[llm]
default_provider = "local"
timeout_s = 120.0
retries_on_bad_json = 1           # one retry when the model returns unparsable JSON
json_retry_max_tokens = 6000      # max_tokens for the one JSON retry (reasoning models)
# max_tokens (here and per task/prompt) is the ANSWER budget; this headroom is added on top for reasoning tokens.
# Each [llm.<task>] may override it; use 0 for endpoints that do not reason.
reasoning_headroom_tokens = 2048
# Fail-fast endpoints answer 503/429 when busy. Retries use exponential backoff with jitter and
# honour Retry-After, until the per-task deadline; then the task's `fallback` models are tried.
retry_max_attempts = 4            # per model
retry_base_s = 1.0
retry_max_s = 15.0
deadline_interactive_s = 45.0     # summary, ask, insight requested by a user
deadline_background_s = 120.0     # triage, tier-2 analysis, caption translation

# First provider: a local OpenAI-compatible server (Ollama, llama.cpp, vLLM, LM Studio ...).
# Omit api_key_env for servers that need no key.
[llm.providers.local]
base_url = "http://127.0.0.1:11434/v1"
max_concurrent = 2                # in-flight requests; interactive work is served before background
reserved_interactive = 1          # slots background work may not use (capped at max_concurrent - 1)
json_mode = false                 # true: send response_format json_object for triage/analysis

# OpenAI itself. api_key_env names the env var holding the key (never the key itself).
# [llm.providers.openai]
# base_url = "https://api.openai.com/v1"
# api_key_env = "UTUBOT_OPENAI_API_KEY"

# OpenRouter.
# [llm.providers.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "UTUBOT_OPENROUTER_API_KEY"

# An LLM router or gateway on your network (any OpenAI-compatible endpoint).
# [llm.providers.router]
# base_url = "http://router.internal:8787/v1"
# api_key_env = "UTUBOT_ROUTER_API_KEY"

# Busy-prone local endpoint with a cloud fallback: see the `fallback` lines below.
# [llm.providers.openrouter] is the cloud side; give it its own max_concurrent (default 2).

# Any configured provider can be named per task or per prompt: model = "openai:gpt-4o-mini".

# Per-task model selection. "provider" is optional (defaults to default_provider);
# "model" may also be written "provider:model".
[llm.triage]                # batched title triage, JSON output
model = "llama3.2:3b"
# fallback = ["openrouter:openai/gpt-4o-mini"]   # tried when the primary stays busy/unavailable
reasoning_effort = "none"
max_tokens = 2500
temperature = 0.2

[llm.summary]               # prompt-set summaries (a prompt's own `model` overrides this)
model = "llama3.1:8b"             # example name; use any model your provider serves
# model = "openrouter:anthropic/claude-sonnet-5.5"   # example override for higher quality
max_tokens = 900
temperature = 0.2
# fallback = ["openrouter:anthropic/claude-sonnet-5.5"]

# The glance summary (side panel shown while browsing) is a few lines, so a small fast model is
# enough and it keeps the panel quick. Without this table it uses [llm.summary] with
# reasoning_effort "none". A reasoning model here should stay on "none" or the lowest your endpoint accepts.
# [llm.glance]
# model = "llama3.2:3b"           # example; any model your provider serves
# provider = "local"              # optional
# fallback = ["openrouter:openai/gpt-4o-mini"]
# reasoning_effort = "none"       # default for this table
# max_tokens = 160                # default; the built-in glance prompt sets its own answer budget

[llm.answer]                # POST /ask
model = "llama3.1:8b"
# fallback = ["openrouter:anthropic/claude-sonnet-5.5"]
max_tokens = 600

[llm.analysis]              # insight and tier-2 inflation analysis
model = "llama3.1:8b"
# fallback = ["openrouter:openai/gpt-4o-mini"]
max_tokens = 900

[llm.captions]              # optional caption translation
model = "llama3.1:8b"
# fallback = ["openrouter:openai/gpt-4o-mini"]
max_tokens = 2000

[assess]
batch_size = 25                    # titles per triage call
max_videos_per_request = 50
wait_ms_cap = 3000
default_wait_ms = 1200
background_concurrency = 2
coalesce_ms = 300                  # merge /v1/assess calls arriving within this window into shared batches
tier2_daily_cap_per_user = 30      # transcript-based deep analyses per user per UTC day (only title-question or clickbait videos, only while YouTube is healthy)
tier2_clickbait_threshold = 0.6
triage_cache_ttl_s = 604800
title_max_chars = 200
description_max_chars = 300

# Everything that reaches YouTube (metadata, caption text, audio) goes through one gate: at most
# `max_concurrent` requests, spaced `min_interval_s` + random(0, jitter_s) apart, interactive before
# background. A 429, 403 or "confirm you're not a bot" opens a circuit breaker: interactive requests
# answer "delayed" at once, background work (tier-2, caption and transcript jobs) waits and resumes.
[youtube]
max_concurrent = 1
min_interval_s = 3.0
jitter_s = 1.5
cooldown_base_s = 300.0            # first cooldown without a Retry-After header (5 min), doubles per consecutive block
cooldown_max_s = 3600.0            # ceiling for any cooldown, Retry-After included (60 min)
network_retry_s = 60.0             # retry hint to clients after a network error (does not open the breaker)
max_background_queue = 5           # tier-2 is not scheduled while this many background fetches wait

[transcripts]
cache_ttl_s = 2592000
no_captions_ttl_s = 259200         # a "no captions" answer (from a complete yt-dlp answer) is remembered this long (3 days), then checked again
video_failure_ttl_s = 3600         # a per-video failure (private, members-only, 403/410 on a caption or media URL) is remembered this long
empty_track_retry_s = 3600         # a caption file that parses to nothing is "delayed" (not "no captions") and not re-fetched for this long
fetch_timeout_s = 60.0
default_language = "en"
# cookies_file = "/var/lib/utubot/cookies.txt"   # only if YouTube starts blocking this host
skip_if_longer_than_s = 14400

[summary]
token_budget = 24000               # transcript tokens (chars/4) sent to the model
chunk_tokens = 8000                # map-reduce chunk size for longer transcripts
chars_per_token = 4
strategy = "map_reduce"            # or "truncate" (keep head 60% + tail 40%)
default_wait_ms = 20000
wait_ms_cap = 60000
adhoc_ttl_s = 3600
max_summary_chars = 1200
max_import_bytes = 262144          # prompt-set import size cap
import_timeout_s = 15.0
import_allow_hosts = []            # exact hostnames exempt from the private-address/port guard
import_max_redirects = 5
panel_prompt = "builtin/glance"    # prompt for auto/side-panel summaries (users can pick their own in the web UI)
auto_long = false                  # true: after a panel summary, also generate the user's default (long) summary in the background
auto_long_max_concurrent = 2       # background long summaries in flight (transcript fetch included); more are skipped until one ends

[captions]
asr_backend = "faster_whisper"     # "faster_whisper" (local CPU) or "openai" (remote /v1/audio/transcriptions)
asr_url = "http://127.0.0.1:8000/v1/audio/transcriptions"
asr_api_key_env = "UTUBOT_ASR_API_KEY"
asr_model = "whisper-1"
asr_chunk_s = 600                  # long audio is split into chunks of this length for the remote API
whisper_model = "small"            # faster_whisper model size (CPU, int8)
whisper_compute_type = "int8"
whisper_threads = 4
diarization = "none"               # "none" or "pyannote" (needs the diarization extra and a token)
hf_token_env = "UTUBOT_HF_TOKEN"
keep_media = false                 # keep downloaded audio under data_dir/media after transcription
max_duration_s = 10800
max_chars_per_line = 42
max_lines = 2
min_cue_s = 1.0
max_cue_s = 7.0
job_concurrency = 1
asr_speed_factor = 1.5             # audio seconds transcribed per second; only used for the "estimate_s" shown to the user
asr_overhead_s = 30                # download + model load, added to the estimate
transcribe_max_active_per_user = 5 # queued or running "transcribe in background" jobs per user
job_max_attempts = 3               # a job that YouTube keeps refusing (429, network) is retried this many times, then fails
media_orphan_age_s = 3600          # on start, scratch directories under data_dir/media older than this are removed (unless keep_media)
max_download_bytes = 419430400     # yt-dlp skips audio larger than this (400 MiB); the duration limit is max_duration_s

# ---- Setup import and public download page ------------------------------------------------
# GET /setup.json (no auth) lets the TV app configure itself from a short address.
# It publishes server.public_base_url, so set that to the URL TVs will use.
[setup]
name = "u·tubot server"            # shown in the app after import
pairing = true                     # the app goes straight to the 6-digit pairing dialog
# prompt_set_urls = ["https://example.com/my-prompts.json"]   # example; sets for the app to import
[setup.defaults]                   # app switch values applied on import
assess = true
mark_only = false
answer_in_menu = true
summary_panel = false
auto_captions = true

# The landing page "/" shows a public Download section from `utubot app publish`.
# Downloader (AFTVnews) short codes, shown when non-empty; keys are ABIs.
[app]
downloader_codes = { arm64-v8a = "", armeabi-v7a = "" }
# `utubot app sync-github` copies new GitHub Releases of the app into the update channel (APKs, update.json).
# github_repo = "owner/repo"                # example; the repository whose utubot-v* releases are published
# signing_cert_sha256 = "<64 hex digits>"   # required to sync: SHA-256 of the release signing certificate
#                                           # (`apksigner verify --print-certs APK`); every APK must match it
# apksigner_path = "/path/to/android-sdk/build-tools/<version>/apksigner"
#                                           # optional: verify with apksigner; unset uses the built-in v2/v3 verifier (RSA keys)
# github_token_env = "UTUBOT_GITHUB_TOKEN"  # optional env var with a GitHub token (only raises the API rate limit)
# keep_versions = 0                         # versions of APK files kept in app_dir after a sync; 0 keeps all
# apksigner_timeout_s = 120.0
# sync_timeout_s = 60.0                     # per HTTP request
# sync_releases_per_page = 20
# release_check_ttl_s = 600                 # the web UI's "latest GitHub release" is cached this long
# release_check_error_ttl_s = 60
# release_check_min_interval_s = 30         # the "check now" button is honoured at most this often
# sync_max_apk_bytes = 209715200            # download cap per APK

# ---- Users --------------------------------------------------------------------------------
# Tokens are not stored here. `utubot user add NAME [--admin]` writes a sha256 hash to
# users.toml; `utubot user pair NAME` makes a one-time code for per-device tokens.
# Defaults for every user's settings (docs/server.md, "Per-user settings"). Users change their own
# in the web UI (GET/PUT /v1/me/settings); their choices are stored as overrides on top of these.
[default_policy]
language = "en"
hide_topics = []
mark_topics = []
hide_clickbait_above = 0.9
mark_clickbait_above = 0.6
hide_low_quality_above = 0.9
mark_low_quality_above = 0.65
mark_inflated_ratio_below = 0.35
inflated_min_duration_s = 300
answer_in_label = false
# auto_long = false               # unset: follows [summary] auto_long
# mark_only = false               # unset: follows [setup.defaults] mark_only (the TV's "mark only, never hide")
auto_transcribe = "on_open"       # off | on_dwell | on_open: transcribe videos without captions by itself
auto_transcribe_max_minutes = 30  # ... but only videos up to this long
summary_delay_ms = 700            # TV: how long a card stays focused before its summary is requested
# summary_panel = false           # unset: follows [setup.defaults] summary_panel
# auto_captions = true            # unset: follows [setup.defaults] auto_captions
update_checks = true              # TV: ask this server for newer app versions
# [default_policy.models]         # per-task model for everyone; unset tasks follow [llm.<task>]
# glance = "llama3.2:3b"          # tasks: glance, summary, answer, triage, analysis

[[users]]
name = "owner"
admin = true
[users.policy]
hide_topics = ["reaction videos", "AI-generated narration slop"]
mark_topics = ["celebrity gossip"]
