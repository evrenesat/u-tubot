name: u-tubot CI

# Every pull request and every push to main gets one run with a conclusion, so a deployment can tell exactly which commit is green.
# The backend and the app are tested only when their files changed. A skipped job counts as passed.
#
# On a push to main, a change to the app (since the newest utubot-v* tag, so a failed or cancelled earlier push is not lost)
# also starts the release workflow once the app tests pass and the backend tests (when they ran) did not fail.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  # One group per commit on main, so no run on main is ever cancelled; a newer push to a pull request replaces the older run.
  group: utubot-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.scan.outputs.backend }}
      app: ${{ steps.scan.outputs.app }}
      release: ${{ steps.scan.outputs.release }}
      extension: ${{ steps.scan.outputs.extension }}
      extension_release: ${{ steps.scan.outputs.extension_release }}
    steps:
      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Find what changed
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: python3 scripts/utubot_ci_changes.py classify

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ai-backend/uv.lock

      - name: Install ffmpeg
        # The caption tests cut audio with it, as the backend does in production.
        working-directory: .
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Check the formatting
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -q

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: u-tubot
          persist-credentials: false

      - name: Set up the Android build
        uses: ./u-tubot/.github/actions/android-env

      - name: Cache the Robolectric Android jars
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            u-tubot/common/build/robolectric-deps
            u-tubot/smarttubetv/build/robolectric-deps
          key: robolectric-deps-${{ hashFiles('u-tubot/gradle/robolectric-offline.gradle') }}

      - name: Unit tests and TV module compile
        working-directory: u-tubot
        run: |
          chmod +x gradlew
          ./gradlew :common:testStutubotDebugUnitTest :smarttubetv:compileStutubotDebugJavaWithJavac

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install the tools
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build every Firefox variant
        run: |
          npm run build:firefox-unlisted
          npm run build:firefox-listed
          npm run build:firefox-test
          npm run build:chromium
          npm run build:chromium-test

      - name: Validate the manifests
        run: |
          npx web-ext lint --source-dir dist/firefox-unlisted --self-hosted
          npx web-ext lint --source-dir dist/firefox-listed
          npx web-ext lint --source-dir dist/firefox-test --self-hosted

  release:
    # Hosted by this repository only: forks do not hold the signing key.
    # A red backend blocks the release too: the app and the backend are one contract, and the deployment of a red commit never
    # happens, so an app released from it would meet a server that does not speak its version yet. Skipped jobs count as passed.
    needs: [changes, backend, app]
    if: >-
      !cancelled() && github.event_name == 'push' && github.repository == 'evrenesat/u-tubot'
      && needs.changes.outputs.release == 'true' && needs.app.result == 'success'
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the release workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run utubot-release.yml --repo "$GITHUB_REPOSITORY" --ref main --field sha="$GITHUB_SHA"
