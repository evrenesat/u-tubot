name: u-tubot parity

# The AI feature parity box: every change to u-tubot AI code or the contract also touches the browser extension or
# the extension plan, or its pull request description has the parity box ticked. This is a check of its own so the
# description edit re-runs only this small job, never the test pipeline. It blocks a merge once the owner makes
# `parity-box` a required status check for main (ai/BROWSER_EXTENSION_PLAN.md, section 9).
on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

jobs:
  parity-box:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check the AI feature parity box
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: pull_request
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/utubot_ci_changes.py parity
