name: u-tubot release

# Builds the signed per-ABI release APKs and publishes them as a GitHub Release: the APKs, SHA256SUMS and release.json
# (version, versionCode, ABIs, SHA-256 per file), which a backend reads with `utubot app sync-github`.
#
# Two ways in:
#   - Automatic: the CI workflow starts this one (input `sha`) for a commit on main that changes the app, after the app tests
#     passed. The version is <series in utubot.version>.<next patch> and the tag utubot-v<version> is created on that commit.
#   - By hand: push a tag like utubot-v0.3.7, or run this workflow with the input `tag`, to build and publish that tag.
# versionName comes from the tag and versionCode is derived from it (docs/development.md, "Releasing").
# An automatic run whose commit is already contained in the newest release does nothing, so runs that reach the queue out of
# order never publish an older build under a newer version.
# Every path is guarded the same way: the commit must be on main and its CI run (app tests, and the backend tests when they
# ran) must be green; a manual run must also be for the newest utubot-v* tag, whose release does not exist yet.
#
# Secrets (Settings, Secrets and variables, Actions):
#   UTUBOT_KEYSTORE_B64    base64 of the release keystore (base64 -w0 utubot-release.jks)
#   UTUBOT_KEYSTORE_PASSWORD, UTUBOT_KEY_ALIAS, UTUBOT_KEY_PASSWORD
on:
  push:
    tags: [ "utubot-v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, for example utubot-v0.3.7'
        required: false
      sha:
        description: 'Commit on main to release as the next version (the CI workflow sets this)'
        required: false

# One release at a time, over the whole run: the next patch number is read from the existing tags.
concurrency:
  group: utubot-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      auto: ${{ steps.source.outputs.auto }}
      ref: ${{ steps.source.outputs.ref }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Resolve what to build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            tag="$PUSHED_TAG"; sha=""
          else
            tag="$INPUT_TAG"; sha="$INPUT_SHA"
          fi
          if [ -n "$tag" ] && [ -n "$sha" ]; then echo "give a tag or a sha, not both" >&2; exit 1; fi
          if [ -n "$tag" ]; then
            [[ $tag =~ ^utubot-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like utubot-vX.Y.Z, got $tag" >&2; exit 1; }
            { echo "auto=false"; echo "ref=refs/tags/$tag"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          elif [ -n "$sha" ]; then
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit hash" >&2; exit 1; }
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)
            case "$status" in
              identical|behind) ;;
              *) echo "commit $sha is not on main (compare status: $status)" >&2; exit 1 ;;
            esac
            { echo "auto=true"; echo "ref=$sha"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          else
            echo "give the input tag or sha" >&2; exit 1
          fi

      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: u-tubot
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ steps.source.outputs.auto }}
          SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/utubot-v" --jq '.[].ref' \
            | sed -n 's#^refs/tags/utubot-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' > "$RUNNER_TEMP/versions.txt"
          # Only a commit whose CI is green is released. CI starts an automatic release while its own run is still open, so
          # then its app and backend jobs must be green (a skipped backend job counts); otherwise a finished run must be green.
          ci_green() {
            local runs id
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/utubot-ci.yml/runs?head_sha=$1&event=push&branch=main&per_page=20" \
              --jq '.workflow_runs[] | [.id, .status, (.conclusion // "")] | @tsv')
            [ -n "$runs" ] || return 1
            if grep -q $'\tcompleted\tsuccess$' <<<"$runs"; then return 0; fi
            [ "$AUTO" = true ] || return 1
            id=$(awk -F '\t' '$2 == "in_progress" { print $1; exit }' <<<"$runs")
            [ -n "$id" ] || return 1
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '
              [.jobs[] | select(.name == "app" or .name == "backend")]
              | length > 0 and all(.[]; .conclusion == "success" or .conclusion == "skipped")')" = true ]
          }

          skip=false
          if [ "$AUTO" != true ]; then
            # A manual release is for the newest tag only, so an older build never goes out under an older number later,
            # and a release that exists is never replaced.
            newest=$(sort -V "$RUNNER_TEMP/versions.txt" | tail -1)
            if [ "${TAG#utubot-v}" != "$newest" ]; then
              echo "::error::$TAG is not the newest tag (utubot-v$newest is); releases only go forward" >&2
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::the release $TAG already exists" >&2
              exit 1
            fi
            commit=$(git -C u-tubot rev-parse HEAD)
            case $(gh api "repos/$GITHUB_REPOSITORY/compare/main...$commit" --jq .status) in
              identical|behind) ;;
              *) echo "::error::$TAG ($commit) is not on main" >&2; exit 1 ;;
            esac
            ci_green "$commit" || { echo "::error::no finished green CI run on main for $TAG ($commit); wait for it or fix it" >&2; exit 1; }
          fi
          if [ "$AUTO" = true ]; then
            newest=$(sort -V "$RUNNER_TEMP/versions.txt" | tail -1)
            if [ -n "$newest" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/utubot-v$newest...$SHA" --jq .status)
              case "$status" in
                identical|behind) skip=true; echo "::notice::utubot-v$newest already contains $SHA; nothing to release" ;;
              esac
            fi
            if [ "$skip" = true ]; then
              VERSION=""; TAG=""
            else
              ci_green "$SHA" || { echo "::error::CI for $SHA is not green (or has not run on main); not releasing it" >&2; exit 1; }
              VERSION=$(python3 u-tubot/scripts/utubot_release.py next-version --series "$(cat u-tubot/utubot.version)" \
                --tags "$RUNNER_TEMP/versions.txt")
              TAG="utubot-v$VERSION"
            fi
          else
            VERSION="${TAG#utubot-v}"
          fi
          echo "releasing $TAG (skip: $skip)"
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # Public repositories use the free hosted runner. For a private repository use the label of your own
    # self-hosted runner instead, for example: runs-on: [self-hosted, my-runner-label]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      AUTO: ${{ needs.plan.outputs.auto }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout u-tubot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: u-tubot
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Set up the Android build
        uses: ./u-tubot/.github/actions/android-env

      - name: Decode the signing key
        env:
          UTUBOT_KEYSTORE_B64: ${{ secrets.UTUBOT_KEYSTORE_B64 }}
        run: |
          test -n "$UTUBOT_KEYSTORE_B64" || { echo "secret UTUBOT_KEYSTORE_B64 is not set" >&2; exit 1; }
          echo "$UTUBOT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/utubot-release.jks"
          echo "UTUBOT_KEYSTORE=$RUNNER_TEMP/utubot-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APKs
        working-directory: u-tubot
        env:
          UTUBOT_VERSION_NAME: ${{ env.VERSION }}
          UTUBOT_KEYSTORE_PASSWORD: ${{ secrets.UTUBOT_KEYSTORE_PASSWORD }}
          UTUBOT_KEY_ALIAS: ${{ secrets.UTUBOT_KEY_ALIAS }}
          UTUBOT_KEY_PASSWORD: ${{ secrets.UTUBOT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # A commit released automatically already passed the app tests in CI.
          tasks=":smarttubetv:assembleStutubotRelease"
          if [ "$AUTO" != true ]; then tasks=":common:testStutubotDebugUnitTest $tasks"; fi
          # shellcheck disable=SC2086 # the task list is meant to split on spaces
          ./gradlew $tasks

      - name: Collect the APKs
        run: |
          rm -f "$RUNNER_TEMP/utubot-release.jks"
          mkdir release
          cp u-tubot/smarttubetv/build/outputs/apk/stutubot/release/u-tubot_*.apk release/
          ls -l release

      - name: Read the signing certificate
        run: |
          apks=(release/u-tubot_*.apk)
          cert=$(python3 u-tubot/scripts/utubot_release.py cert --apksigner "$ANDROID_BUILD_TOOLS_DIR/apksigner" "${apks[0]}")
          echo "signing certificate SHA-256: ${cert:-unknown}"
          echo "CERT=$cert" >> "$GITHUB_ENV"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha || env.TAG }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/utubot-v" --jq '.[].ref' \
            | sed -n 's#^refs/tags/utubot-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' > "$RUNNER_TEMP/versions.txt"
          python3 u-tubot/scripts/utubot_release.py notes --repo "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$SHA" \
            --changelog u-tubot/CHANGELOG.md --tags "$RUNNER_TEMP/versions.txt" --cert "$CERT" --out notes.md
          cat notes.md

      - name: Write release.json and the checksums
        run: |
          python3 u-tubot/scripts/utubot_release.py manifest --dir release --tag "$TAG" --version "$VERSION" \
            --aapt2 "$ANDROID_BUILD_TOOLS_DIR/aapt2" --cert "$CERT" --notes notes.md
          cat release/release.json
          (cd release && sha256sum --check SHA256SUMS)

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if [ "$AUTO" = true ]; then target=(--target "$TARGET_SHA"); else target=(--verify-tag); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${target[@]}" \
            --title "u·tubot $VERSION" --notes-file notes.md
