name: Android build environment
description: >-
  Checks out the two sibling repositories the Android build reads (settings.gradle), sets up JDK 25 with a Gradle cache and
  installs the Android SDK packages. Run it after checking out u-tubot into ./u-tubot.

inputs:
  shared-modules-sha:
    description: Pinned SharedModules commit. Bump it on purpose when the base app is synced.
    default: 18ba193b83b65da775d5861e1cd4d179c62360a6
  media-service-core-sha:
    description: Pinned MediaServiceCore commit. Bump it on purpose when the base app is synced.
    default: 173b3c3059288d87526e52c0dacdb48f06bbb013
  sdk-packages:
    description: Android SDK packages to install, separated by spaces.
    default: platforms;android-37.0 build-tools;30.0.3 ndk;30.0.16248370

runs:
  using: composite
  steps:
    - name: Checkout SharedModules
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: cygnusx-1-org/SharedModules
        ref: ${{ inputs.shared-modules-sha }}
        path: SharedModules
        persist-credentials: false

    - name: Checkout MediaServiceCore
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: cygnusx-1-org/MediaServiceCore
        ref: ${{ inputs.media-service-core-sha }}
        path: MediaServiceCore
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up the Android SDK
      shell: bash
      env:
        SDK_PACKAGES: ${{ inputs.sdk-packages }}
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        # shellcheck disable=SC2086 # the package list is meant to split on spaces
        "$SDK/cmdline-tools/latest/bin/sdkmanager" $SDK_PACKAGES >/dev/null
        BUILD_TOOLS=$(tr ' ' '\n' <<<"$SDK_PACKAGES" | sed -n 's/^build-tools;//p' | head -1)
        echo "ANDROID_BUILD_TOOLS_DIR=$SDK/build-tools/$BUILD_TOOLS" >> "$GITHUB_ENV"
